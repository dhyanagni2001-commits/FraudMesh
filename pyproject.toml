[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fraudmesh"
version = "0.1.0"
description = "Graph-based fraud ring detection: XGBoost vs. GraphSAGE ablation with a FastAPI serving layer."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24,<2",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "networkx>=3.0",
    "torch>=2.1",
    "torch_geometric>=2.4",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.0",
    "apscheduler>=3.10",
    "matplotlib>=3.7",
    "plotly>=5.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
]

[project.scripts]
fraudmesh-baseline = "src.train_baseline:main"
fraudmesh-graph-features = "src.train_graph_features:main"
fraudmesh-graphsage = "src.train_graphsage:main"
fraudmesh-case-study = "src.case_study:main"
fraudmesh-serve = "src.serve:main"

[tool.setuptools]
packages = ["src"]
py-modules = ["config"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
